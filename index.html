<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sublunar Point Tracker</title>
  <meta name="description" content="Find where the Moon is directly overhead, when it will pass over a city, and animate its path on a map.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="panel">
    <header>
      <h1>🌕 Sublunar Point</h1>
      <p class="sub">Where on Earth is the Moon directly overhead?</p>
    </header>

    <section>
      <h2>1 · Moment</h2>
      <div class="row">
        <input type="datetime-local" id="time" step="60">
        <button id="now">Now</button>
      </div>
      <dl id="readout" class="readout"></dl>
    </section>

    <section>
      <h2>2 · Find an overhead pass</h2>
      <div class="search">
        <input type="search" id="place" placeholder="City (e.g. Honolulu)" autocomplete="off">
        <button id="osm" title="Search OpenStreetMap for any place">Search OSM</button>
        <ul id="placeList" class="dropdown" hidden></ul>
      </div>
      <div class="row">
        <label>Lat <input type="number" id="lat" step="any" min="-90" max="90"></label>
        <label>Lon <input type="number" id="lon" step="any" min="-180" max="180"></label>
      </div>
      <p class="hint">…or click anywhere on the map.</p>
      <div class="row">
        <label>Search
          <select id="years">
            <option value="1">1 year</option>
            <option value="2">2 years</option>
            <option value="5">5 years</option>
          </select>
        </label>
        <label>Within <input type="number" id="threshold" value="50" min="1" max="2000" step="1"> km</label>
      </div>
      <div class="row">
        <label>Suggest cities with pop. ≥
          <select id="minPop">
            <option value="0">any</option>
            <option value="100000" selected>100k</option>
            <option value="1000000">1M</option>
          </select>
        </label>
      </div>
      <button id="find" class="primary">Find passes</button>
      <div id="results"></div>
    </section>

    <section>
      <h2>3 · Path &amp; animation</h2>
      <div class="row">
        <label>From <input type="datetime-local" id="pathStart" step="60"></label>
      </div>
      <div class="row">
        <label>To <input type="datetime-local" id="pathEnd" step="60"></label>
      </div>
      <button id="drawPath">Draw path</button>
      <div class="player">
        <button id="play" title="Play / pause">▶</button>
        <input type="range" id="scrub" min="0" max="1000" value="0">
        <select id="speed" title="Simulation speed">
          <option value="60">1 min/s</option>
          <option value="600">10 min/s</option>
          <option value="3600" selected>1 h/s</option>
          <option value="21600">6 h/s</option>
          <option value="86400">1 day/s</option>
        </select>
      </div>
      <p id="playTime" class="hint"></p>
    </section>

    <footer>
      Ephemeris: <a href="https://github.com/cosinekitty/astronomy">Astronomy Engine</a> ·
      Cities: <a href="https://www.naturalearthdata.com/">Natural Earth</a> ·
      Geocoding: <a href="https://nominatim.openstreetmap.org/">Nominatim</a>
    </footer>
  </aside>

  <main id="map"></main>
  <div id="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
